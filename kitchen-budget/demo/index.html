<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pantry Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root { --bg: #2b2a3d; --text: #f4ecd6; }
body { margin: 0; background: var(--bg); background-image: linear-gradient(45deg, #302f44 25%, transparent 25%, transparent 75%, #302f44 75%), linear-gradient(45deg, #302f44 25%, transparent 25%, transparent 75%, #302f44 75%); background-size: 32px 32px; background-position: 0 0, 16px 16px; color: var(--text); font: 16px/1.4 "Pixelify Sans", ui-monospace, monospace; }
main.kb { color: var(--text); max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.top p { max-width: 60ch; margin: 6px 0 0; opacity: .85; }
h1 { margin: 0; font-size: 28px; letter-spacing: 2px; color: #f6c453; text-shadow: 3px 3px 0 #1b1a2e; }
h2 { margin: 0; font-size: 17px; }
.top .kb-ticket { color: var(--kb-ink); min-width: 190px; }
.panel { color: var(--kb-ink); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row input[type=range] { flex: 1; min-width: 160px; accent-color: #e67e22; }
.chip { font: inherit; font-size: 14px; color: var(--kb-ink); background: var(--kb-panel); border: 3px solid var(--kb-ink); border-radius: 0; padding: 6px 10px; cursor: pointer; box-shadow: 0 3px 0 0 var(--kb-ink); }
.chip[aria-pressed="true"] { background: var(--kb-ink); color: var(--kb-panel); }
.chip:active { transform: translateY(3px); box-shadow: none; }
.chip:disabled { opacity: .6; cursor: progress; }
.chip.go { background: #f6c453; font-size: 16px; padding: 10px 14px; }
.warn { margin: 0; color: var(--kb-squeeze); font-size: 14px; }
.hint { margin: 0; font-size: 14px; opacity: .8; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 16px; }
.station { color: var(--kb-ink); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.station[data-boosted] { box-shadow: 3px 3px 0 0 var(--kb-ink), 0 0 0 3px #f6c453; }
.head { display: flex; gap: 10px; align-items: center; cursor: pointer; user-select: none; }
.sprite { position: relative; background: var(--kb-paper); border: 3px solid var(--kb-ink); width: 70px; height: 70px; display: grid; place-items: center; flex: none; }
.sprite .badge { position: absolute; top: -14px; left: -10px; }
.meta { margin: 2px 0 0; font-size: 13px; color: var(--kb-muted); }
.foot select { font: inherit; font-size: 14px; border: 3px solid var(--kb-ink); border-radius: 0; background: var(--kb-panel); color: var(--kb-ink); padding: 3px 4px; flex: 1; }
.pin { font-size: 13px; display: flex; gap: 4px; align-items: center; cursor: pointer; }
.tuner { flex-direction: row; align-items: flex-start; flex-wrap: wrap; }
.tuner ul { margin: 0 0 8px; padding-left: 18px; }
.tuner li { margin-bottom: 4px; }
.arm { animation: chop steps(2) infinite alternate; transform-origin: 8px 12px; }
@keyframes chop { from { transform: translateY(0); } to { transform: translateY(-2px); } }
@media (prefers-reduced-motion: reduce) { .arm { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="dist/demo.js"></script>
</body>
</html>
